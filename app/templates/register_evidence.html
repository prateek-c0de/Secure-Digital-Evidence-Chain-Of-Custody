{% extends "base.html" %}
{% block content %}
<h2>Register Digital Evidence</h2>
<div class="card" style="max-width: 800px;">
    <form method="POST" enctype="multipart/form-data">
        <div class="grid-2">
            <div class="form-group">
                <label for="case_number">Case Number</label>
                <input type="text" id="case_number" name="case_number" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="name">Evidence Name</label>
                <input type="text" id="name" name="name" class="form-control" required>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label for="type">Evidence Type</label>
                <select id="type" name="type" class="form-control" required>
                    <option value="IMAGE">Image</option>
                    <option value="VIDEO">Video</option>
                    <option value="AUDIO">Audio</option>
                    <option value="DOCUMENT">Document</option>
                    <option value="DISK_IMAGE">Disk Image</option>
                    <option value="OTHER">Other Digital File</option>
                </select>
            </div>
            <div class="form-group">
                <label for="file">Digital Evidence File</label>
                <input type="file" id="file" name="file" class="form-control" required>
                <small style="color: var(--text-muted);">The system will automatically generate a SHA-256 integrity hash.</small>
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">Description & Notes</label>
            <textarea id="description" name="description" class="form-control" rows="4"></textarea>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label for="collection_location">Collection Location</label>
                <input type="text" id="collection_location" name="collection_location" class="form-control">
            </div>
            <div class="form-group">
                <label for="collection_device">Source Device / IP</label>
                <input type="text" id="collection_device" name="collection_device" class="form-control">
            </div>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn btn-success">Secure & Register Evidence</button>
            <a href="{{ url_for('dashboard.index') }}" class="btn" style="background-color: var(--secondary-color); color: white; margin-left: 1rem;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
